 <div style="opacity:.85;font-size:13px">${f(sp)} sorti sur ${f(sal)}${sal&&rest>0?' · '+f(rest/dl)+' par jour':''}${pn?'<br>'+pn:''}${sal?'<br>Reste à vivre (après charges fixes et dettes du mois) : <b>'+f(rest-sum(recDue(m))-debtDue(m))+'</b>':''}</div>
 <div class="stack">${ENV.map(e=>`<i style="width:${S.pct[e[0]]}%;background:${e[2]}"></i>`).join('')}</div></div>
 <div class="qa"><button data-a="fab"><b>➕</b>Dépense</button><button data-a="ext"><b>💵</b>Revenu</button><button data-a="${S.acc.length>1?'tra':'adda'}"><b>🔁</b>${S.acc.length>1?'Transfert':'Compte'}</button><button data-a="bilan"><b>📄</b>Bilan</button></div><div class="card"><div class="mu">Salaire de ${MO[now.getMonth()]}</div><div class="row"><input id="sal" type="number" inputmode="decimal" placeholder="Votre salaire net" value="${S.inc[m]||''}"><button class="btn sm" data-a="sal">Valider</button></div><button class="btn ghost sm" data-a="ext" style="margin-top:8px">+ Prime ou revenu en plus</button><div class="mu" style="margin-top:8px">Erreur ? Entrez le bon montant et validez : il remplace l’ancien. Les mois passés se corrigent dans l’Historique.</div></div>${S.pop>0?'<button class="btn ghost" style="width:100%;margin-bottom:12px" data-a="popgo">🍲 Popote du jour · '+f(S.pop)+'</button>':''}${S.qk.length?'<div class="row" style="flex-wrap:wrap;margin-bottom:12px">'+S.qk.map((q,i)=>`<button class="chip" data-a="qkgo" data-i="${i}">${esc(q.n)} · ${f(q.a)}</button>`).join('')+'</div>':''}${installCard()}${demoCard()}${patHome()}${lateCard()}${bizCard()}${S.easy?'':stkCard()}${sal&&!S.easy?scoreCard(ex,sal):''}${tipsCard(ex,sal,now)}`;
 if(!sal)h+=`<div class="empty">Saisissez votre salaire : il sera réparti automatiquement dans vos volets.<br><br><button class="btn ghost sm" data-a="tab" data-t="aide">Comment ça marche ?</button></div>`;
 else h+='<h2>Vos volets</h2>'+ENV.map(([k,n,c])=>{const al=sal*S.pct[k]/100,u=sum(ex.filter(e=>e.env===k)),p=al?Math.min(100,u/al*100):0;
  return `<div class="card"><div class="row sp"><div class="row"><span class="dot" style="background:${c}"></span><b>${n}</b></div><span class="tag ${u>al?'r':''}">${S.pct[k]}%</span></div>
  <div class="mu" style="margin-top:6px">${f(u)} sur ${f(al)}${u>al?' · dépassé de '+f(u-al):' · reste '+f(al-u)+(al&&u>=al*.8?' · bientôt atteint':'')}</div><div class="bar"><i style="width:${p}%;background:${u>al?'var(--bad)':c}"></i></div><button class="btn ghost sm" data-a="xp" data-e="${k}" style="margin-top:10px">+ Dépense</button></div>`}).join('');
 if((S.exp.length>2||S.proj.length)&&Date.now()-(S.lastBk||0)>6048e5)h+=`<div class="card row sp"><span>Pensez à sauvegarder vos données</span><button class="btn sm" data-a="bk">Sauvegarder</button></div>`;if(!S.easy)h+=fuelCard()+pxCard()+cdCard()+accCard();if(S.rec.length)h+=chargesCard(m);const t=[];moreRem(t,now);S.ech.forEach(x=>{const k=(new Date(x.d+'T00:00:00')-now)/864e5;if(k<=30)t.push('<b>'+esc(x.n)+'</b> '+(k<0?'expiré':'dans '+Math.ceil(k)+' j'))});S.debts.forEach(d=>{if(d.date&&d.total>sum(d.pay)){const k=(new Date(d.date+'T00:00:00')-now)/864e5;if(k<=15)t.push(`<b>${esc(d.n)}</b> ${d.t==='dette'?'à rembourser':'à récupérer'} ${k<0?'(en retard)':'dans '+Math.ceil(k)+' j'}`)}});S.proj.forEach(p=>{(p.tasks||[]).filter(x=>!x.done).forEach(x=>t.push(`${esc(x.t)} <span class="mu">· ${esc(p.name)}</span>`));
  if(p.date){const d=(new Date(p.date+'T00:00:00')-now)/864e5;if(d>=0&&d<=30&&p.saved<p.target)t.push(`<b>${esc(p.name)}</b> arrive à échéance dans ${Math.ceil(d)} j`)}});
 if(t.length)h+=`<h2>Rappels</h2><div class="card">${t.slice(0,8).map(x=>`<div class="task"><span>${x}</span></div>`).join('')}</div>`;
 return h}

function budget(){
 const tot=Object.values(S.pct).reduce((a,b)=>a+b,0);
 return `<h2>Répartition du salaire</h2><div class="card">${ENV.map(([k,n,c])=>`<div><div class="row sp"><span class="row"><span class="dot" style="background:${c}"></span>${n}</span><b id="p_${k}">${S.pct[k]}%</b></div><input type="range" min="0" max="100" value="${S.pct[k]}" data-r="${k}"></div>`).join('')}
 <div class="mu" style="margin-bottom:8px">Faites glisser chaque curseur : le total doit faire 100 %.</div><div class="row sp"><span class="mu">Total</span><span class="tag" id="tot">${tot}%</span></div></div>
 <h2>Simulateur d’épargne</h2><div class="card"><div class="mu">Combien voulez-vous mettre de côté chaque mois ?</div><input id="sv" type="number" inputmode="decimal" placeholder="Montant à épargner par mois">
 <div class="mu">Objectif total (facultatif)</div><input id="sg" type="number" inputmode="decimal" placeholder="Somme à atteindre">
 <div class="row"><button class="btn" data-a="sim">Calculer</button></div><div id="simres" style="margin-top:12px"></div></div>
 <h2>Charges fixes</h2><div class="card"><div class="mu">Loyer, électricité, eau, crédit téléphone, scolarité… ajoutez-les une fois : elles reviennent chaque mois sur l’Accueil.</div>${S.rec.map(r=>`<div class="task"><span>${esc(r.n)} · le ${r.day}${r.ev>1?' · tous les '+r.ev+' mois':''}</span><b style="margin-left:auto">${f(r.a)}</b><button class="btn del" style="color:var(--pr)" data-a="editrec" data-id="${r.id}">✎</button><button class="btn del" data-a="delrec" data-id="${r.id}" aria-label="Supprimer">✕</button></div>`).join('')}<button class="btn ghost sm" data-a="addrec" style="margin-top:10px">+ Ajouter</button></div><h2>Affichage</h2><div class="card"><div class="mu">Taille du texte</div><select data-fs="1"><option value="n" ${S.fs==='n'?'selected':''}>Normale</option><option value="l" ${S.fs==='l'?'selected':''}>Grande</option><option value="x" ${S.fs==='x'?'selected':''}>Très grande</option></select><div class="mu">Le thème clair ou sombre se change avec le bouton « Thème » en haut.</div></div><h2>Sécurité et rappels</h2><div class="card"><button class="btn ghost" style="width:100%;margin-bottom:8px" data-a="pin">${S.pin?'Changer ou retirer le code PIN':'Définir un code PIN'}</button><label class="task"><input type="checkbox" ${S.bio?'checked':''} data-a="bio"><span>Déverrouiller avec l’empreinte ou le visage</span></label><label class="task"><input type="checkbox" ${S.hide?'checked':''} data-a="hide"><span>Masquer les montants (👁 en haut)</span></label><label class="task"><input type="checkbox" ${S.ps?'checked':''} data-a="ps"><span>Bloquer les captures d’écran et l’aperçu</span></label><div class="mu" style="margin-top:8px">Verrouiller après</div><select data-lm="1"><option value="0" ${S.lockMs===0?'selected':''}>Immédiatement</option><option value="60000" ${S.lockMs==null||S.lockMs===60000?'selected':''}>1 minute</option><option value="300000" ${S.lockMs===300000?'selected':''}>5 minutes</option></select><button class="btn ghost" style="width:100%;margin-bottom:8px" data-a="notif">${S.nOn?'Rappels activés ✓':'Activer les rappels sur le téléphone'}</button><label class="task"><input type="checkbox" ${S.nd?'checked':''} data-a="nd"><span>Rappel chaque soir à 20 h : noter mes dépenses</span></label><div class="mu" style="margin-top:8px">Rappels, empreinte et blocage des captures : application Android (APK) uniquement. Le code PIN marche aussi sur iPhone et sur le web ; sur iPhone, utilisez « Exporter vers le calendrier » (Outils > Échéances) pour recevoir des alertes.</div></div><h2>Mon profil</h2><div class="card"><input id="nm" placeholder="Votre prénom" value="${esc(S.name||'')}" data-nm="1"><select id="pf"><option value="fonct" ${S.prof==='fonct'?'selected':''}>Fonctionnaire</option><option value="priv" ${S.prof==='priv'?'selected':''}>Salarié du privé</option><option value="indep" ${S.prof==='indep'?'selected':''}>Indépendant ou commerçant</option><option value="agri" ${S.prof==='agri'?'selected':''}>Agriculteur ou éleveur</option><option value="etud" ${S.prof==='etud'?'selected':''}>Étudiant ou apprenti</option></select><div class="mu">Thème de couleurs</div><select data-th="1">${Object.keys(TH).map(k=>`<option value="${k}" ${(S.th||'mali')===k?'selected':''}>${TH[k].n}</option>`).join('')}</select><label class="task"><input type="checkbox" ${S.easy?'checked':''} data-a="easy"><span>Mode simplifié (moins d’écrans)</span></label><div class="mu">Jour de paie (0 = fin de mois) : le « par jour » se calcule jusqu’à la prochaine paie.</div><input type="number" inputmode="numeric" min="0" max="31" value="${S.pay||''}" placeholder="Ex. 28" data-pd="1"><button class="btn" data-a="prof">Appliquer la répartition du profil</button></div><h2>Devise</h2><div class="card"><input id="cur" value="${esc(S.cur)}" maxlength="6" data-c="1"></div>`}

function proj(){
 if(!S.proj.length)return `<div class="empty">Aucun projet pour l’instant.<br>Voiture, maison, moto, téléphone : ajoutez-en un avec le bouton ci-dessous.</div>`;
 return `<h2>Mes projets</h2>`+S.proj.map((p,i)=>{
  const rem=Math.max(0,p.target-p.saved),pr=p.target?Math.min(100,p.saved/p.target*100):0,dl=p.date?new Date(p.date+'T00:00:00'):null;
  const ml=dl?Math.max(1,Math.ceil((dl-new Date())/2592e6)):0;let eta=null;
  if(p.contrib>0&&rem>0){eta=new Date();eta.setMonth(eta.getMonth()+Math.ceil(rem/p.contrib))}
  let st=rem===0?['Objectif atteint','g']:eta&&dl?(eta<=dl?['Dans les temps','g']:['En retard','r']):['En cours',''];
  return `<div class="card"><div class="row sp"><b>${esc(p.name)}</b><span class="tag ${st[1]}">${st[0]}</span></div>
  <div class="mu" style="margin-top:6px">${f(p.saved)} sur ${f(p.target)} · ${Math.round(pr)}%</div><div class="bar"><i style="width:${pr}%;background:var(--pr)"></i></div>
  <div class="mu" style="margin-top:10px">${dl?'Échéance : '+fd(dl)+(rem?'<br>À mettre de côté : '+f(rem/ml)+' par mois':''):'Aucune échéance'}${eta?'<br>À votre rythme ('+f(p.contrib)+'/mois) : terminé le '+fd(eta):''}</div>
  <div style="margin-top:10px">${(p.tasks||[]).map((x,j)=>`<label class="task ${x.done?'d':''}"><input type="checkbox" ${x.done?'checked':''} data-a="tk" data-i="${i}" data-j="${j}"><span>${esc(x.t)}</span></label>`).join('')}</div>
  <div class="row" style="margin-top:6px"><input id="nt${i}" placeholder="Nouvelle tâche" style="margin:0"><button class="btn sm" data-a="addtk" data-i="${i}">Ajouter</button></div>
  <div class="row sp" style="margin-top:10px"><button class="btn ghost sm" data-a="pay" data-i="${i}">+ Verser</button><button class="btn ghost sm" data-a="editp" data-i="${i}">Modifier</button><button class="btn del" data-a="delp" data-i="${i}">Supprimer</button></div></div>`}).join('')}

function hist(){
 const ys=new Set([new Date().getFullYear()]);S.exp.forEach(e=>ys.add(+e.d.slice(0,4)));Object.keys(S.inc).forEach(k=>ys.add(+k.slice(0,4)));
 const pre=hm?hy+'-'+hm:''+hy,ex=S.exp.filter(e=>e.d.startsWith(pre)).sort((a,b)=>b.d.localeCompare(a.d));
 const inc=Object.entries(S.inc).filter(([k])=>k.startsWith(pre)).reduce((s,[,v])=>s+v,0)+sum(S.ext.filter(e=>e.d.startsWith(pre))),sp=sum(ex);
 let h=`<button class="btn" style="width:100%;margin-bottom:12px" data-a="bilan">Bilan de santé du budget (PDF)</button><div class="row"><select id="hy" data-h="y">${[...ys].sort().map(y=>`<option ${y===hy?'selected':''}>${y}</option>`).join('')}</select>
 <select id="hm" data-h="m"><option value="">Toute l’année</option>${MO.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===hm?'selected':''}>${n}</option>`}).join('')}</select></div>
 <div class="card"><div class="row sp"><span class="mu">Total gagné</span><b>${f(inc)}</b></div><div class="row sp" style="margin-top:8px"><span class="mu">Total dépensé</span><b>${f(sp)}</b></div>
 <div class="row sp" style="margin-top:8px"><span class="mu">Solde</span><b style="color:${inc-sp<0?'var(--bad)':'var(--ok)'}">${f(inc-sp)}</b></div></div>`;
 if(!hm){const mv=MO.map((_,i)=>sum(ex.filter(e=>e.d.slice(5,7)===String(i+1).padStart(2,'0')))),mx=Math.max(1,...mv);
  h+=`<div class="card"><b>Dépenses par mois</b><div class="cols">${mv.map((v,i)=>`<div><i style="height:${v/mx*85}%"></i>${MO[i].slice(0,1).toUpperCase()}</div>`).join('')}</div></div>`}
 h+=(S.easy?'':charts(ex,inc,sp))+`<h2>Par volet</h2><div class="card">${ENV.map(([k,n,c])=>`<div class="row sp" style="padding:5px 0"><span class="row"><span class="dot" style="background:${c}"></span>${n}</span><b>${f(sum(ex.filter(e=>e.env===k)))}</b></div>`).join('')}</div>${salList(pre)}${extList(pre)}${bizList(pre)}<h2>Opérations</h2><input id="hq" placeholder="Rechercher une opération…">`;
 return h+(ex.length?ex.map(e=>{const en=ENV.find(x=>x[0]===e.env);return `<div class="card row sp opc" data-s="${esc(((e.n||'')+' '+en[1]+' '+e.a).toLowerCase())}"><div><b>${esc(e.n||en[1])}</b><div class="mu">${en[1]} · ${fd(new Date(e.d+'T00:00:00'))}</div></div><div class="row"><b>${f(e.a)}</b><button class="btn del" style="color:var(--pr)" data-a="ex" data-id="${e.id}" aria-label="Modifier">✎</button><button class="btn del" data-a="dx" data-id="${e.id}" aria-label="Supprimer">✕</button></div></div>`}).join(''):'<div class="empty">Aucune dépense sur cette période.<br>Les pourcentages ne sont que des parts prévues : chaque dépense se note avec « + Dépense ».</div>')}

function aide(){
 const Q=[
 ['Par où commencer ?','Sur l’Accueil, saisissez votre salaire net du mois et touchez « Valider ». Il est aussitôt réparti entre vos volets. Ensuite, notez chaque dépense avec le bouton « + Dépense ».'],
 ['Comment modifier ou supprimer une dépense ?','Ouvrez l’Historique, choisissez l’année et le mois, puis touchez ✎ à droite de la dépense pour changer le montant, le volet, la description ou la date. Touchez ✕ pour la supprimer. Les volets et le reste se recalculent aussitôt.'],['Pourquoi mon historique est vide après avoir saisi mon salaire ?','Les pourcentages sont seulement des parts prévues pour chaque volet : ils ne créent aucune dépense. L’historique se remplit quand vous notez ce que vous dépensez, avec « + Dépense » (sur l’Accueil, dans chaque volet, ou dans l’Historique). Votre salaire apparaît déjà dans « Total gagné ».'],['Comment fonctionne la répartition du salaire ?','Chaque volet reçoit un pourcentage de votre salaire. Dans l’onglet Budget, faites glisser les curseurs : le total doit faire 100 %. Le bouton du profil (fonctionnaire, privé, indépendant) propose une répartition de départ que vous pouvez modifier.'],
 ['Que veut dire le montant « Reste » en haut ?','C’est votre salaire (plus les primes ajoutées) moins toutes les sorties du mois, épargne comprise. Le montant « par jour » est ce reste divisé par les jours avant la prochaine paie.'],
 ['À quoi sert le simulateur d’épargne ?','Entrez la somme que vous voulez mettre de côté chaque mois : l’application vous dit combien vous pouvez dépenser au maximum, par mois et par jour. Avec un objectif total, elle donne aussi la date où vous l’atteindrez. « Appliquer » règle votre répartition en conséquence.'],
 ['Comment suivre un projet et sa date de fin ?','Créez un projet avec son coût, la date souhaitée et ce que vous pouvez verser par mois. L’application calcule combien mettre de côté par mois pour finir à temps, et la date de fin à votre rythme. « + Verser » ajoute l’argent mis de côté.'],
 ['Comment fonctionnent les rappels ?','Les tâches non cochées et les projets qui arrivent à échéance dans moins de 30 jours apparaissent dans « Rappels » sur l’Accueil. Cochez une tâche quand elle est faite : elle disparaît des rappels. L’application n’envoie pas encore de notification sur le téléphone.'],
 ['Que signifie « Santé financière » ?','C’est une note sur 100. Elle monte quand vous épargnez et baisse pour chaque volet dont vous dépassez la part prévue. Elle sert de repère, pas de jugement.'],
 ['Que faire si je dépasse un volet ?','Le volet passe en rouge. Vous pouvez réduire un autre volet avec les curseurs, ou puiser dans les Imprévus. Si cela se répète chaque mois, augmentez la part de ce volet dans Budget.'],
 ['Que mettre dans Cérémonies et solidarité, et dans Tontine ?','Cérémonies et solidarité : baptêmes, mariages, décès, aide à la famille élargie. Tontine : vos cotisations régulières. Notez-les comme des dépenses dans ces volets.'],
 ['Comment ajouter une prime ou un autre revenu ?','Sur l’Accueil, touchez « + Prime ou revenu en plus ». Ce montant s’ajoute au salaire du mois et se répartit dans vos volets.'],
 ['Comment revoir mes dépenses passées ?','Dans Historique, choisissez une année et, si vous voulez, un mois. Vous voyez le total gagné, le total dépensé, le solde, le détail par volet et la liste des opérations. Touchez ✕ pour supprimer une erreur.'],
 ['Mes données sont-elles en sécurité ?','Elles sont enregistrées uniquement sur ce téléphone, dans le navigateur. Si vous effacez les données du navigateur ou changez de téléphone, elles disparaissent. Faites une sauvegarde de temps en temps (en bas de cette page).'],
 ['À quoi servent les charges fixes ?','Dans Budget, ajoutez une fois vos dépenses qui reviennent chaque mois (loyer, électricité, eau, scolarité…). Elles apparaissent sur l’Accueil : touchez « Payer » quand c’est fait, et le montant est noté dans le volet choisi.'],['Que veut dire « Reste à vivre » ?','C’est ce qu’il vous reste vraiment à dépenser : votre argent du mois moins ce que vous avez déjà dépensé, moins les charges fixes pas encore payées et les mensualités de dettes à venir.'],['Comment noter une dette ou une avance sur salaire ?','Dans Projets, en bas, touchez « + Dette ou avance ». Choisissez « Je dois » (avance, dette) ou « On me doit » (argent prêté). Chaque remboursement est suivi : celui que vous faites compte dans Dépenses familiales, celui que vous recevez s’ajoute à vos revenus.'],['Comment utiliser tontines, graphiques et compte à rebours ?','Projets > « + Tontine » : indiquez les membres dans l’ordre des tours, la cotisation et votre numéro de tour. L’application calcule la date où vous recevez la somme ; « Cotisation payée » la note dans le volet Tontine. L’Historique montre le graphique des dépenses par volet et la comparaison d’un mois à l’autre. Sur l’Accueil, le compte à rebours donne l’épargne mensuelle pour chaque projet daté ; entrez la date de la Tabaski ou de la rentrée dans le projet.'],['À quoi servent les comptes ?','Sur l’Accueil, « + Compte » crée un portefeuille (espèces, Orange Money, Moov Money, banque) avec son solde actuel. Le compte principal (⭐) reçoit votre salaire ; les dépenses et revenus sans compte précisé passent par lui, ou choisissez un autre compte (espèces, Orange Money…). « Transfert » déplace de l’argent entre deux comptes, avec les frais s’il y en a.'],['Comment installer sur iPhone ou sur le web ?','Ouvrez le lien de l’application dans Safari (iPhone) ou Chrome (Android), puis « Sur l’écran d’accueil » / « Installer ». Elle s’ouvre en plein écran et marche sans connexion. Sur iPhone, installez-la vraiment : sinon Safari peut effacer les données d’un site peu utilisé. Faites aussi des sauvegardes. Notifications, empreinte et blocage des captures n’existent que dans l’APK Android ; sur iPhone, exportez vos échéances vers le calendrier pour avoir des alertes.'],['Que montre la démo animée ?','Une mini-vidéo de 45 secondes, sans connexion : saisie du salaire, répartition en volets, dépense en un geste, projet qui atteint son objectif, outils du quotidien et code PIN. Boutons pause, rejouer et voix (si votre téléphone sait lire le français). Elle est dans Aide et sur l’Accueil au début.'],['Que contient l’onglet Outils ?','Popote du jour (le montant du marché noté en un geste), Échéances et papiers (carte NINA, passeport, assurance… avec rappels), Carnet de solidarité (dons faits et reçus pour baptêmes, mariages, décès : à qui rendre, qui vous doit), Provision de vivres (pour combien de jours), Patrimoine (comptes, bétail, bijoux, terrain… moins les dettes), Revenus irréguliers (budget prudent pour les mois creux), Calculateurs (€ ↔ FCFA à la parité fixe de 655,957, prix de vente, coût d’un trajet, partage) et Contacts utiles avec bouton Appeler.'],['À quoi servent les thèmes et le mode simplifié ?','Budget > Mon profil : choisissez un thème de couleurs (Mali, Fleuve Niger, Terre, Violet). Chaque onglet a aussi sa propre bande de couleur. Le mode simplifié cache les cartes avancées (graphiques, stock, prix, comptes) pour ne garder que l’essentiel : salaire, volets, dépenses, charges fixes et rappels. Dans une nouvelle dépense, les montants rapides (500, 1 000, 2 000…) et les boutons marché, Sotrama, crédit… accélèrent la saisie.'],['Comment suivre carburant, prix et salaire en retard ?','Accueil > Carburant : notez chaque achat (litres et montant) pour voir le prix moyen réellement payé, comparé au prix officiel que vous saisissez vous-même. « Carnet de prix » : relevez riz, huile, sucre, gaz… et suivez la variation. Si la paie dépasse le jour prévu sans salaire saisi, un rappel de priorités s’affiche. Historique : « Énergie et frais » résume ce que coûtent l’électricité, le groupe, le gaz et les retraits. Projets : le modèle « Fonds de sécurité (3 mois) » aide à constituer une réserve.'],['Comment utiliser le stock, la recherche et la taille du texte ?','Commerçant : dans « Stock », ajoutez vos produits (quantité, prix d’achat et de vente, seuil d’alerte). « Vendre » retire du stock et note la vente ; « +Stock » ajoute des unités et peut noter l’achat. Historique : le champ « Rechercher » filtre les opérations. Budget > Mon profil : choisissez la taille du texte.'],['Comment annuler une modification ?','Après chaque correction (salaire, dépense, revenu), un bouton « Annuler » apparaît pendant 8 secondes. Plus tard, ouvrez Aide > Journal des modifications : chaque ligne indique l’ancien et le nouveau montant, avec un bouton « Rétablir ». Le journal garde les 100 dernières modifications.'],['Comment corriger mon salaire ou changer de profil ?','Salaire du mois : entrez le bon montant sur l’Accueil et validez, il remplace l’ancien. Mois passés : Historique > Salaires > ✎. Pour revenir en arrière plus largement, utilisez les copies automatiques (Aide > Sauvegarder ou restaurer). Touchez votre photo en haut à gauche pour ajouter photo, téléphone, e-mail et adresse (facultatifs) et pour passer d’un profil à l’autre : chaque profil a ses propres données, son PIN et ses sauvegardes.'],['Comment gérer mon commerce ?','Dans Budget > Mon profil, choisissez « Indépendant ou commerçant » puis appliquez : la carte « Mon commerce » apparaît sur l’Accueil. Notez vos ventes, achats de stock et charges ; l’application calcule le bénéfice et la marge. « Me verser » transfère une part au budget personnel (vos prélèvements remplacent le salaire). « Règles » fixe la part à réinvestir et celle à mettre de côté pour les impôts. Une vente « à crédit » va dans Dettes et avances (On me doit) et devient une vente quand le client paie.'],['Quelles protections sont disponibles ?','Dans Budget > Sécurité : code PIN de 4 à 6 chiffres (bloqué 30 secondes après 5 erreurs), déverrouillage par empreinte ou reconnaissance faciale selon votre téléphone (avec le code ou le schéma du téléphone en secours), délai de verrouillage, masquage des montants (👁) et blocage des captures d’écran. Ces protections verrouillent l’accès à l’application ; elles ne chiffrent pas les données enregistrées.'],['Comment fonctionne le code PIN ?','Dans Budget > Sécurité et rappels, définissez un code à 4 chiffres. Il est demandé à l’ouverture et après une minute en arrière-plan. Il protège l’accès à l’application, mais ne chiffre pas les données. Si vous l’oubliez, il faudra effacer les données de l’application : faites des sauvegardes.'],['Comment activer les rappels ?','Dans Budget > Sécurité et rappels, touchez « Activer les rappels » et acceptez l’autorisation. Vous recevez alors des notifications pour la paie, les charges fixes, les projets et dettes proches de l’échéance, et, si vous le souhaitez, un rappel chaque soir.'],['Comment fonctionne la sauvegarde ?','Dans Aide, touchez « Sauvegarder ou restaurer ». Vous pouvez partager un fichier de sauvegarde (WhatsApp, e-mail, Drive), le protéger par un mot de passe, ou restaurer depuis un fichier ou un texte. Une copie automatique est aussi gardée chaque jour sur le téléphone (10 maximum). Si vous oubliez le mot de passe, la sauvegarde protégée ne peut pas être ouverte.'],['Comment obtenir le bilan en PDF ?','Dans Historique, choisissez l’année ou le mois puis touchez « Bilan de santé du budget (PDF) ». Le bilan résume revenus, dépenses, épargne, volets, charges fixes, dettes et projets. Touchez « Partager le PDF » ou copiez le texte.'],['Comment changer la devise ?','Dans Budget, tout en bas, modifiez le champ « Devise » (FCFA par défaut).']];
 const G=[['Volet','une enveloppe de votre salaire (épargne, santé, carburant…) avec son pourcentage.'],['Dépassement','quand vous dépensez plus que la part prévue pour un volet.'],['Solde','ce que vous avez gagné moins ce que vous avez dépensé.'],['Tontine','épargne collective où chacun cotise à chaque tour et un membre reçoit la somme.'],['Échéance','la date à laquelle un projet doit être terminé.'],['Charge fixe','dépense qui revient chaque mois pour le même montant (loyer, eau, électricité).'],['Reste à vivre','ce qu’il reste après les dépenses faites et les charges et dettes à venir.'],['Fonds d’imprévus','argent gardé pour les urgences (santé, panne, famille).']];
 return `<button class="btn ghost" style="width:100%;margin-top:14px" data-a="tour">🎬 Revoir la présentation</button><button class="btn ghost" style="width:100%;margin-top:8px" data-a="demo">▶ Voir la démo animée</button><h2>Démarrage rapide</h2><div class="card">${['1. Accueil : saisissez votre salaire net et validez.','2. Budget : choisissez votre profil et ajustez les pourcentages.','3. Accueil : notez chaque dépense avec « + Dépense ».','4. Projets : créez un projet, cochez ses tâches et versez de l’argent.','5. Historique : relisez vos mois et vos années.'].map(x=>`<div class="task"><span>${x}</span></div>`).join('')}</div>
 <h2>Questions fréquentes</h2>${Q.map(([q,a])=>`<details class="card"><summary>${q}</summary><p>${a}</p></details>`).join('')}
 <h2>Petit lexique</h2><div class="card">${G.map(([t,d])=>`<div class="task"><span><b>${t}</b> : ${d}</span></div>`).join('')}</div>
 ${installHelp()}<h2>Mes données</h2><div class="card"><div class="mu">Vos données restent sur ce téléphone.</div><button class="btn" style="margin-top:10px;width:100%" data-a="bk">Sauvegarder ou restaurer</button><button class="btn ghost" style="width:100%;margin-top:8px" data-a="jrn">Journal des modifications</button></div><h2>À propos</h2><div class="card"><b>Mon Budget</b> · version 3<div class="mu" style="margin-top:8px">© 2026 @red76. Tous droits réservés.</div><div style="margin-top:10px">Merci à Brimo, Kass, Safle Bogoti et à mes parents pour leur soutien.</div></div>`}
function backupOld(){
 sheet('Sauvegarde',`<div class="mu">Copiez ce texte pour garder une sauvegarde. Pour restaurer, collez-le ici puis touchez « Restaurer ».</div><textarea name="j" style="width:100%;height:150px;margin:8px 0;border-radius:12px;padding:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:12px monospace">${esc(JSON.stringify(S))}</textarea><button class="btn del" data-a="rst">Tout effacer</button>`,
 v=>{try{const o=JSON.parse(v('j'));if(!o||typeof o!=='object'||!o.pct)throw 0;S=Object.assign({},DEF,o);S.pct=Object.assign({social:0,tontine:0},S.pct);S.ext=S.ext||[];save();R()}catch(e){alert('Texte invalide');return false}},'Restaurer')}
function R(){
 $('#v').innerHTML=banner(tab)+({home,budget,proj:()=>proj()+debtsView()+tonView(),hist,plus,aide}[tab])();
 $('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
 const fb=$('#fab');fb.style.display=tab==='home'||tab==='proj'||tab==='hist'?'block':'none';fb.textContent=tab==='proj'?'+ Projet':'+ Dépense';
 $('#dt').textContent=greet()+' · '+fd(new Date());avatar();if(tab==='home'&&lastT!=='home')countUp();lastT=tab}

function sheet(title,body,ok,label){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sh"><h3>${title}</h3>${body}<div class="row"><button class="btn ghost" data-x>Annuler</button><button class="btn" data-ok>${label||'Enregistrer'}</button></div></div>`;
 document.body.appendChild(o);
 o.addEventListener('click',e=>{if(e.target===o||e.target.hasAttribute('data-x'))o.remove();else if(e.target.hasAttribute('data-ok')){if(ok(k=>(o.querySelector('[name='+k+']')||{}).value||'')!==false)o.remove()}})}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
 if(a==='tab'){tab=t.dataset.t;try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}R();scrollTo(0,0)}
 else if(a==='theme'){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';S.theme=r.dataset.theme;save()}
 else if(a==='sal'){const v=+$('#sal').value;if(v>=0){const mm=ym(new Date()),o=S.inc[mm];if(o!==undefined&&o!==v)lg('Salaire '+MO[new Date().getMonth()]+' : '+f2(o)+' → '+f2(v)+' · reste du mois : '+f2(rm(mm,o))+' → '+f2(rm(mm,v)),{c:'inc',id:mm,o});S.inc[mm]=v;S.salT[mm]=Date.now();save();R()}}
 else if(a==='fab'){tab==='proj'?addProj():addExp()}
 else if(a==='xp')addExp(t.dataset.e)
 else if(a==='tk'){const x=S.proj[i].tasks[+t.dataset.j];x.done=t.checked;save();R()}
 else if(a==='addtk'){const v=$('#nt'+i).value.trim();if(v){(S.proj[i].tasks=S.proj[i].tasks||[]).push({t:v,done:false});save();R()}}
 else if(a==='pay')sheet('Verser sur le projet',`<input name="a" type="number" inputmode="decimal" placeholder="Montant">`,v=>{const n=+v('a');if(!(n>0))return false;const was=S.proj[i].saved<S.proj[i].target;S.proj[i].saved+=n;if(was&&S.proj[i].saved>=S.proj[i].target){party();note('Objectif atteint, bravo !')}save();R()},'Verser');
 else if(a==='delp'){if(confirm('Supprimer ce projet ?')){S.proj.splice(i,1);save();R()}}
 else if(a==='dx'){const o=S.exp.find(x=>x.id===t.dataset.id);if(o)lg('Dépense supprimée : '+(o.n||o.env)+' '+f2(o.a),{c:'exp',id:o.id,o:{...o}});S.exp=S.exp.filter(x=>x.id!==t.dataset.id);save();R()}
 else if(a==='ex')editExp(t.dataset.id)
 else if(a==='sim')sim();
 else if(a==='prof'){S.prof=$('#pf').value;S.pct=Object.assign({},PRE[S.prof]);save();R()}
 else if(a==='ext')addExt()
 else if(a==='bk')backup()
 else if(moreActs(a,t)){}
 else if(a==='addrec')addRec()
 else if(a==='addd')addDebt()
 else if(a==='dpay')dpay(i)
 else if(a==='delrec'){S.rec=S.rec.filter(x=>x.id!==t.dataset.id);save();R()}
 else if(a==='deld'){if(confirm('Supprimer cette ligne ?')){S.debts.splice(i,1);save();R()}}
 else if(a==='rpay'){const r=S.rec.find(x=>x.id===t.dataset.id),m=mNow();if(r&&!S.rp[r.id+'|'+m]){S.rp[r.id+'|'+m]=1;S.exp.push({id:Date.now()+'r',env:r.env,a:r.a,n:r.n,d:ymd(new Date())});save();R()}}
 else if(a==='rst'){if(confirm('Effacer toutes vos données ?')){S=JSON.parse(JSON.stringify(DEF));save();document.querySelector('.ov')?.remove();R()}}});

document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.r){S.pct[t.dataset.r]=+t.value;$('#p_'+t.dataset.r).textContent=t.value+'%';const s=Object.values(S.pct).reduce((a,b)=>a+b,0),g=$('#tot');g.textContent=s+'%';g.className='tag '+(s===100?'g':'r');save()}
 else if(t.dataset.c){S.cur=t.value.trim()||'FCFA';save()}
 else if(t.dataset.pd){S.pay=Math.min(31,Math.max(0,+t.value||0));save()}
 else if(t.dataset.nm){S.name=t.value.trim();save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.h==='y')hy=+t.value;else if(t.dataset.h==='m')hm=t.value;else return;R()});

function addExp(pe){
 sheet('Nouvelle dépense',qeChips()+accSel('')+famSel('')+`<select name="e">${ENV.map(x=>`<option value="${x[0]}" ${x[0]===pe?'selected':''}>${x[1]}</option>`).join('')}</select><input name="a" type="number" inputmode="decimal" placeholder="Montant"><input name="n" placeholder="Description (facultatif)"><input name="d" type="date" value="${ymd(new Date())}">`,
 v=>{const a=+v('a');if(!(a>0)||!v('d'))return false;S.exp.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),env:v('e'),a,n:v('n').trim(),d:v('d'),acc:v('c'),p:v('p')});save();R()})}
function editExp(id){const e=S.exp.find(x=>x.id===id);if(!e)return;
 sheet('Modifier la dépense',accSel(e.acc)+famSel(e.p)+`<select name="e">${ENV.map(x=>`<option value="${x[0]}" ${x[0]===e.env?'selected':''}>${x[1]}</option>`).join('')}</select><input name="a" type="number" inputmode="decimal" value="${e.a}"><input name="n" value="${esc(e.n||'')}" placeholder="Description (facultatif)"><input name="d" type="date" value="${e.d}">`,
 v=>{const a=+v('a');if(!(a>0)||!v('d'))return false;lg('Dépense modifiée : '+(e.n||e.env)+' '+f2(e.a)+' → '+f2(a),{c:'exp',id:e.id,o:{...e}});Object.assign(e,{env:v('e'),a,n:v('n').trim(),d:v('d'),acc:v('c'),p:v('p')});save();R()})}
function addExt(){
 sheet('Prime ou revenu en plus',accSel('')+`<input name="n" list="xl" placeholder="Ex. prime, activité annexe, aide reçue"><datalist id="xl"><option>Gain du jour</option><option>Travail journalier</option><option>Vente du marché</option><option>Envoi de la famille ou de la diaspora</option><option>Prime</option><option>Activité annexe</option><option>Aide reçue</option></datalist><input name="a" type="number" inputmode="decimal" placeholder="Montant"><input name="d" type="date" value="${ymd(new Date())}">`,
 v=>{const a=+v('a');if(!(a>0)||!v('d'))return false;S.ext.push({id:Date.now()+'',a,n:v('n').trim(),d:v('d'),acc:v('c')});save();R()})}
const chargesCard=m=>`<h2>Charges fixes du mois</h2><div class="card">${S.rec.filter(r=>recOn(r,m)).map(r=>{const ok=S.rp[r.id+'|'+m];return `<div class="task ${ok?'d':''}"><span>${esc(r.n)} · le ${r.day}</span><b style="margin-left:auto">${f(r.a)}</b>${ok?'<span class="tag g">Payé</span>':`<button class="btn sm" data-a="rpay" data-id="${r.id}">Payer</button>`}</div>`}).join('')}</div>`;
function debtsView(){return '<h2>Dettes et avances</h2>'+(S.debts.length?S.debts.map((d,i)=>{const pd=sum(d.pay),rem=Math.max(0,d.total-pd),p=d.total?Math.min(100,pd/d.total*100):0,dd=d.date?new Date(d.date+'T00:00:00'):null,je=d.t==='dette';return `<div class="card"><div class="row sp"><b>${esc(d.n)}</b><span class="tag ${je?'r':'g'}">${je?'Je dois':'On me doit'}</span></div><div class="mu" style="margin-top:6px">${f(pd)} sur ${f(d.total)} · reste ${f(rem)}</div><div class="bar"><i style="width:${p}%;background:${je?'var(--bad)':'var(--ok)'}"></i></div><div class="mu" style="margin-top:8px">${d.who?esc(d.who)+' · ':''}${dd?'Échéance : '+fd(dd):'Sans échéance'}${d.mens>0&&rem?'<br>Mensualité : '+f(d.mens):''}</div>${d.pay.map((x,j)=>`<div class="task"><span class="mu">${fd(new Date(x.d+'T00:00:00'))}</span><b style="margin-left:auto">${f(x.a)}</b><button class="btn del" style="color:var(--pr)" data-a="editpay" data-i="${i}" data-j="${j}">✎</button></div>`).join('')}<div class="row sp" style="margin-top:10px"><button class="btn ghost sm" data-a="dpay" data-i="${i}">${je?'+ Rembourser':'+ Reçu'}</button><button class="btn del" data-a="deld" data-i="${i}">Supprimer</button></div></div>`}).join(''):'<div class="empty">Aucune dette ni avance. Notez ici une avance sur salaire, un prêt reçu ou une somme prêtée.</div>')+'<button class="btn ghost" style="width:100%" data-a="addd">+ Dette ou avance</button>'}
function addRec(){
 sheet('Charge fixe',`<input name="n" list="rl" placeholder="Ex. Loyer, électricité, eau, scolarité"><datalist id="rl"><option>Loyer</option><option>Électricité (EDM)</option><option>Eau (SOMAGEP)</option><option>Forfait internet / crédit</option><option>Scolarité</option><option>Aide aux parents</option><option>Transport</option><option>Cotisation tontine</option></datalist><input name="a" type="number" inputmode="decimal" placeholder="Montant par mois"><input name="y" type="number" inputmode="numeric" min="1" max="31" placeholder="Jour du mois (ex. 5)"><select name="ev"><option value="1">Chaque mois</option><option value="3">Chaque trimestre</option><option value="6">Tous les 6 mois</option><option value="12">Chaque année</option></select><select name="e">${ENV.map(x=>`<option value="${x[0]}" ${x[0]==='famille'?'selected':''}>${x[1]}</option>`).join('')}</select>`,
 v=>{const a=+v('a'),n=v('n').trim();if(!n||!(a>0))return false;S.rec.push({id:Date.now()+'',n,a,day:Math.min(31,Math.max(1,+v('y')||1)),env:v('e'),ev:+v('ev')||1,base:new Date().getFullYear()*12+new Date().getMonth()});save();R()})}
function addDebt(){
 sheet('Dette ou avance',`<select name="t"><option value="dette">Je dois (dette, avance sur salaire)</option><option value="pret">On me doit (j’ai prêté)</option></select><input name="n" placeholder="Nom (ex. Avance de salaire)"><input name="w" placeholder="Personne ou organisme (facultatif)"><input name="a" type="number" inputmode="decimal" placeholder="Montant total"><input name="m" type="number" inputmode="decimal" placeholder="Mensualité (facultatif)"><div class="mu">Échéance (facultatif)</div><input name="d" type="date">`,
 v=>{const a=+v('a'),n=v('n').trim();if(!n||!(a>0))return false;S.debts.push({id:Date.now()+'',t:v('t'),n,who:v('w').trim(),total:a,mens:+v('m')||0,date:v('d'),pay:[]});save();R()})}
function dpay(i){const d=S.debts[i];
 sheet(d.t==='dette'?'Rembourser':'Somme reçue',`<input name="a" type="number" inputmode="decimal" placeholder="Montant"><input name="d" type="date" value="${ymd(new Date())}">`,
 v=>{const a=+v('a'),dt=v('d');if(!(a>0)||!dt)return false;const xid=Date.now()+'x';d.pay.push({a,d:dt,x:xid});if(d.t==='dette')S.exp.push({id:xid,env:'famille',a,n:'Remboursement : '+d.n,d:dt});else if(d.biz)S.biz.push({id:xid,t:'vente',a,n:d.n,d:dt,acc:''});else S.ext.push({id:xid,a,n:'Remboursement reçu : '+d.n,d:dt});save();R()})}
let lastB='';const NL=String.fromCharCode(10),SKf=()=>'mon_budget_snaps'+(KEY==='mon_budget_v1'?'':KEY);

function calc(k){const T={eur:['€ ↔ FCFA',[['e','Euros'],['c','FCFA']]],prix:['Prix de vente',[['c','Coût d’achat'],['m','Marge souhaitée (%)']]],trj:['Coût d’un trajet',[['d','Distance (km)'],['l','Consommation (litres pour 100 km)'],['p','Prix du litre']]],par:['Partager un montant',[['t','Montant total'],['n','Nombre de personnes']]],zak:['Zakat (indicatif)',[['p','Prix de l’or (le gramme)'],['b','Mes biens imposables']]]}[k];
 sheet(T[0],T[1].map(([n,p])=>`<input name="${n}" type="number" inputmode="decimal" placeholder="${p}"${k==='trj'&&n==='p'&&S.fp?` value="${S.fp}"`:k==='zak'&&n==='b'?` value="${patNet()}"`:''}>`).join('')+'<div id="cr" style="margin:6px 0 12px;font-weight:700"></div>',()=>{},'Fermer');
 const o=document.querySelector('.ov'),g=n=>+(o.querySelector('[name='+n+']').value)||0,out=t=>{o.querySelector('#cr').textContent=t};
 o.addEventListener('input',e=>{const n=e.target.name;
  if(k==='eur'){const E=o.querySelector('[name=e]'),C=o.querySelector('[name=c]');if(n==='e')C.value=Math.round(g('e')*655.957)||'';else E.value=g('c')?Math.round(g('c')/655.957*100)/100:'';out('1 € = 655,957 FCFA (parité fixe)')}
  else if(k==='prix'){const pv=g('c')*(1+g('m')/100);out(g('c')?'Prix de vente : '+f2(pv)+' · bénéfice par unité : '+f2(pv-g('c')):'')}
  else if(k==='trj'){const L=g('d')*g('l')/100;out(g('d')&&g('l')?L.toFixed(1)+' L · coût : '+f2(L*g('p')):'')}
  else if(k==='zak'){const ni=85*g('p');out(g('p')&&g('b')?(g('b')>=ni?'Zakat indicative : '+f2(g('b')*.025)+' (2,5 %)':'Sous le seuil : '+f2(ni)):'Seuil = 85 g d’or. Indicatif : à confirmer avec une personne qualifiée.')}else out(g('n')>0?'Part de chacun : '+f2(g('t')/g('n')):'')})}

function demo(){S.demo=1;save();const SC=DEMO(),D=7000,o=document.createElement('div');o.className='dmo';let n=0,t=0,paused=false,voice=false;
 o.innerHTML=`<div class="cap"><b id="dtl"></b><span id="dtx"></span></div><div class="stage"><div class="dph" id="dsc"></div></div><div class="dseg">${SC.map(()=>'<i><u></u></i>').join('')}</div><div class="tb"><button class="btn ghost" data-d="pp">⏸ Pause</button><button class="btn ghost" data-d="rs">↻</button>${'speechSynthesis' in window?'<button class="btn ghost" data-d="vo" style="opacity:.5">🔊</button>':''}<button class="btn" data-d="x">Fermer</button></div>`;document.body.appendChild(o);

function icsExport(){const CR=String.fromCharCode(13)+String.fromCharCode(10),dd=s=>s.split('-').join(''),cl=s=>String(s).replace(/[,;]/g,' '),u=()=>Math.random().toString(36).slice(2)+'@monbudget',now=new Date(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mon Budget//FR','CALSCALE:GREGORIAN'];

  oth.forEach(e=>S.pct[e[0]]=Math.round((100-ne)*S.pct[e[0]]/os*10)/10);S.pct.epargne=ne;save();R();tab='budget';R()}}
