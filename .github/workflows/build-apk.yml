name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Permission biométrie
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />#' android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Numéro de version (augmente à chaque construction)
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/;s/versionName \"1.0\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Signer l'APK
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "Secrets absents : construction d'un APK de test (non mis à jour facilement)"
            cd android && ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../Mon-Budget.apk
            exit 0
          fi
          echo "$KS" | base64 -d > ks.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:PW --key-pass env:PW --ks-key-alias monbudget --out Mon-Budget.apk aligned.apk
          $BT/apksigner verify Mon-Budget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mon-budget-apk
          path: Mon-Budget.apk
